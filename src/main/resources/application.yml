spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moing
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

kakao:
  api-key: ${KAKAO_API_KEY:}
  user-info-url: https://kapi.kakao.com/v2/user/me

# 구글/애플은 앱이 보낸 ID token(JWT)을 서버가 검증한다.
# client-ids는 토큰의 aud와 대조할 값으로, iOS/안드로이드 client id가 다르면 콤마로 나열한다.
google:
  client-ids: ${GOOGLE_CLIENT_IDS:}
  jwks-url: https://www.googleapis.com/oauth2/v3/certs
  issuer: https://accounts.google.com

apple:
  client-ids: ${APPLE_CLIENT_IDS:}
  jwks-url: https://appleid.apple.com/auth/keys
  issuer: https://appleid.apple.com

naver:
  api-key-id: ${NAVER_API_KEY_ID:}
  api-key: ${NAVER_API_KEY:}

seoul:
  city-data-api-key: ${SEOUL_CITY_DATA_API_KEY:}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ap-northeast-2
    bucket: moing-reviews

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs